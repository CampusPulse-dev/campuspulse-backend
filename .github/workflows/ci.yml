name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push supersedes the run in flight — do not burn minutes on stale commits.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint, types, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck

      - name: OpenAPI spec is up to date
        # The frontend generates its types from the committed openapi.json.
        # If a schema or route changed without regenerating it, the frontend
        # would build against a stale contract — so fail here instead.
        run: npm run openapi:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campuspulse
          POSTGRES_PASSWORD: campuspulse
          POSTGRES_DB: campuspulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U campuspulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://campuspulse:campuspulse@localhost:5432/campuspulse_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-value-that-is-long-enough-for-validation
      QR_SIGNING_SECRET: ci-qr-secret-value-that-is-long-enough-here
      WEB_ORIGIN: http://localhost:3000
      DEV_AUTH_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Unit tests
        run: npm run test -- --passWithNoTests --coverage
      - name: E2E tests
        run: npm run test:e2e -- --passWithNoTests

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build

  migrations:
    name: Migration drift check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campuspulse
          POSTGRES_PASSWORD: campuspulse
          POSTGRES_DB: campuspulse_drift
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U campuspulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://campuspulse:campuspulse@localhost:5432/campuspulse_drift?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Schema and migrations must agree
        # Catches a schema.prisma edited without a matching migration —
        # otherwise it only surfaces at deploy time.
        run: npx prisma migrate diff --from-migrations ./prisma/migrations --to-schema-datamodel ./prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code
