name: campuspulse-s6-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campuspulse
      POSTGRES_PASSWORD: campuspulse-test-only
      POSTGRES_DB: campuspulse_test
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campuspulse -d campuspulse_test']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: campuspulse-test
      MINIO_ROOT_PASSWORD: campuspulse-test-only
    ports: ['127.0.0.1:59000:9000']
  buckets:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_started }
    entrypoint: /bin/sh
    command:
      - -ec
      - |
        until mc alias set test http://minio:9000 campuspulse-test campuspulse-test-only; do sleep 2; done
        mc mb --ignore-existing test/campuspulse-test-media
        mc mb --ignore-existing test/campuspulse-test-private
        mc anonymous set download test/campuspulse-test-media
        mc anonymous set none test/campuspulse-test-private
        mc ready test
