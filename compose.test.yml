name: campuspulse-s6-test
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campuspulse
      POSTGRES_PASSWORD: campuspulse-test-only
      POSTGRES_DB: campuspulse_test
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campuspulse -d campuspulse_test']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    build:
      context: .
      dockerfile: docker/minio.test.Dockerfile
    command: ['server', '/tmp/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: campuspulse-test
      MINIO_ROOT_PASSWORD: campuspulse-test-only
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3104,http://127.0.0.1:3104,http://localhost:3000
    ports: ['127.0.0.1:59000:9000']
