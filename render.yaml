# Render blueprint. Frankfurt is the closest region Render offers to
# Ibadan; see docs/adr/0001-tech-stack.md for the latency reasoning.
services:
  - type: web
    name: campuspulse-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: starter
    branch: main
    healthCheckPath: /api/v1/health/live
    autoDeploy: false # promotions are deliberate; CI gates first
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: campuspulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: campuspulse-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: QR_SIGNING_PRIVATE_KEY
        sync: false
      - key: DEV_AUTH_ENABLED
        value: 'false'
      - key: EMAIL_TRANSPORT
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PRIVATE_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false # set to the Vercel production domain
      - key: LOG_LEVEL
        value: info

  - type: redis
    name: campuspulse-redis
    region: frankfurt
    plan: starter
    maxmemoryPolicy: noeviction # BullMQ jobs must not be evicted

databases:
  - name: campuspulse-db
    databaseName: campuspulse
    user: campuspulse
    region: frankfurt
    plan: basic-256mb
